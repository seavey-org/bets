name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  changes:
    if: github.event_name != 'pull_request' || !github.event.pull_request.head.repo.fork
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      deployment: ${{ steps.filter.outputs.deployment }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
              - 'Dockerfile'
            frontend:
              - 'frontend/**'
              - 'Dockerfile'
            deployment:
              - 'deployment/**'
              - 'docker-compose.yml'

  backend-lint-test:
    needs: changes
    if: (github.event_name != 'pull_request' || !github.event.pull_request.head.repo.fork) && (needs.changes.outputs.backend == 'true' || github.event_name == 'push')
    runs-on:
      group: homelab-runners
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - name: Install build deps
        run: |
          if command -v dnf &>/dev/null; then
            sudo dnf install -y gcc
          elif command -v apt-get &>/dev/null; then
            sudo apt-get update && sudo apt-get install -y gcc
          fi
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          working-directory: backend
      - name: Test
        working-directory: backend
        run: CGO_ENABLED=1 go test -race -v ./...

  frontend-lint-build:
    needs: changes
    if: (github.event_name != 'pull_request' || !github.event.pull_request.head.repo.fork) && (needs.changes.outputs.frontend == 'true' || github.event_name == 'push')
    runs-on:
      group: homelab-runners
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        working-directory: frontend
        run: npm ci
      - name: Lint
        working-directory: frontend
        run: npm run lint
      - name: Build
        working-directory: frontend
        run: npm run build

  docker-build-push:
    needs: [backend-lint-test, frontend-lint-build]
    if: |
      always() &&
      github.event_name == 'push' && github.ref == 'refs/heads/main' &&
      !contains(needs.*.result, 'failure') &&
      !contains(needs.*.result, 'cancelled')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/seavey-org/bets/app:${{ github.sha }}
            ghcr.io/seavey-org/bets/app:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: [docker-build-push, changes]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on:
      group: homelab-runners
    environment: production
    env:
      PROD_HOST: "192.168.86.227"
      PROD_USER: "cody"
      APP_DIR: "/home/cody/bets"
      SSH_OPTS: "-o StrictHostKeyChecking=accept-new -o ConnectTimeout=10"
    steps:
      - uses: actions/checkout@v4

      - name: Copy files to server
        run: |
          ssh ${SSH_OPTS} ${PROD_USER}@${PROD_HOST} "mkdir -p ${APP_DIR}"
          scp ${SSH_OPTS} docker-compose.yml ${PROD_USER}@${PROD_HOST}:${APP_DIR}/docker-compose.yml
          scp -r ${SSH_OPTS} deployment ${PROD_USER}@${PROD_HOST}:${APP_DIR}/

      - name: Write .env with secrets
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
        run: |
          ENV_FILE=$(mktemp)
          {
            printf 'IMAGE_TAG=%s\n' "${{ github.sha }}"
            printf 'GOOGLE_CLIENT_ID=%s\n' "${GOOGLE_CLIENT_ID}"
            printf 'GOOGLE_CLIENT_SECRET=%s\n' "${GOOGLE_CLIENT_SECRET}"
            printf 'JWT_SECRET=%s\n' "${JWT_SECRET}"
          } > "$ENV_FILE"
          scp ${SSH_OPTS} "$ENV_FILE" ${PROD_USER}@${PROD_HOST}:${APP_DIR}/.env
          rm -f "$ENV_FILE"
          ssh ${SSH_OPTS} ${PROD_USER}@${PROD_HOST} "chmod 600 ${APP_DIR}/.env"

      - name: Deploy
        run: |
          ssh ${SSH_OPTS} ${PROD_USER}@${PROD_HOST} "echo '${{ github.token }}' | docker login ghcr.io -u ${{ github.actor }} --password-stdin"
          ssh ${SSH_OPTS} ${PROD_USER}@${PROD_HOST} "docker pull ghcr.io/seavey-org/bets/app:${{ github.sha }}"
          ssh ${SSH_OPTS} ${PROD_USER}@${PROD_HOST} "cd ${APP_DIR} && docker compose down --remove-orphans || true"
          ssh ${SSH_OPTS} ${PROD_USER}@${PROD_HOST} "STALE=\$(docker ps -q --filter 'publish=3083') || true; if [ -n \"\$STALE\" ]; then docker rm -f \$STALE; fi"
          ssh ${SSH_OPTS} ${PROD_USER}@${PROD_HOST} "cd ${APP_DIR} && docker compose up -d"
          sleep 3
          ssh ${SSH_OPTS} ${PROD_USER}@${PROD_HOST} "curl -sf http://localhost:3083/health"
          ssh ${SSH_OPTS} ${PROD_USER}@${PROD_HOST} "docker image prune -af --filter 'until=168h' || true"

      - name: Update nginx config
        if: needs.changes.outputs.deployment == 'true'
        run: |
          ssh ${SSH_OPTS} ${PROD_USER}@${PROD_HOST} "
            sudo cp ${APP_DIR}/deployment/bets.seavey.dev.conf /etc/nginx/conf.d/bets.seavey.dev.conf
            sudo nginx -t && sudo systemctl reload nginx
          "

      - name: Purge Cloudflare cache
        if: needs.changes.outputs.frontend == 'true'
        run: |
          curl -s -X POST "https://api.cloudflare.com/client/v4/zones/${{ secrets.CLOUDFLARE_ZONE_ID }}/purge_cache" \
            -H "Authorization: Bearer ${{ secrets.CLOUDFLARE_API_TOKEN }}" \
            -H "Content-Type: application/json" \
            --data '{"purge_everything":true}'
